id: chat_based_assessment
name: Chat-Based Assessment
description: An assessment tool to evaluate student understanding of a lesson topic through a chat interface.
contextSources:
  - fetchStudentInterests
  - fetchLessonData
systemPrompt: |
  You are an expert, encouraging tutor evaluating a student's understanding of a specific lesson objective based on three key concept targets.
  Your goal is to converse with the student, ask probing questions one at a time, and determine their level of mastery.

  ### Scoring Rubric for Each Concept Target (0-2)
  0 = no evidence of understanding, mostly incorrect understanding, or no relevant answer.
  1 = partial understanding, vague understanding, memorized language without explanation, or a mixture of correct and incorrect ideas.
  2 = clear and accurate understanding in the student’s own words.

  IMPORTANT: Each score must include a brief evidence statement based ONLY on the student’s actual response. Do not infer understanding that the student has not demonstrated.

  ### Instructions:
  1. Ask only one question at a time.
  2. Never ask a question that is substantially similar to a previous question.
  3. Use the `question_history` from the CURRENT ASSESSMENT STATE as authoritative to avoid repeating questions.
  4. Use the most recent student reply as authoritative for evaluating their knowledge.
  5. Choose the next question by targeting a concept that still needs more evidence (score 0 or 1).
  6. Score student understanding using the concept target rubric, not by general impression.
  7. Return structured output using the provided schema. Provide a short "tip" giving guidance on how they can improve.

initialMessagePrompt: |
  Please greet the student and ask the first assessment question about the lesson objective.
model: gpt-4o
temperature: 0.5
maxTokens: 800
saveHandler: trackAssessmentScore
outputSpec:
  type: object
  properties:
    current_question_evaluation:
      type: object
      properties:
        target_concept_id:
          type: string
        score:
          type: integer
        evidence:
          type: string
      required: [target_concept_id, score, evidence]
    updated_concept_scores:
      type: array
      items:
        type: object
        properties:
          concept_id:
            type: string
          score:
            type: integer
          evidence:
            type: string
        required: [concept_id, score, evidence]
    misconceptions_detected:
      type: array
      items:
        type: string
    next_question_target:
      type: string
    next_question:
      type: string
    summary:
      type: string
      description: A brief evaluative summary of the user's understanding of this lesson so far.
    tip:
      type: string
      description: An instructional nudge (20 words or less) guiding the student on how to improve.
  required: [current_question_evaluation, updated_concept_scores, misconceptions_detected, next_question_target, next_question, summary, tip]
  additionalProperties: false
ui:
  title: Lesson Assessment
  subtitle: Chat to assess your understanding of the lesson.
  placeholder: Type your response...
  inputs:
    - id: user_id
      label: Student Code
      type: text
      placeholder: Enter student ID
    - id: lesson_code
      label: Lesson Topic
      type: select
      dynamicOptions:
        collection: lesson_topics
        labelField: title
        valueField: id
